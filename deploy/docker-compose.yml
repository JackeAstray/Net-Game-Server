# =====================================================================
# Net-Game-Server 一键集群（docker compose）
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml ps
#   curl http://127.0.0.1:41306/healthz   # Center 存活
#   curl http://127.0.0.1:41307/readyz    # Battle 就绪（/readyz 在关服排空时返回 503）
#
# 拓扑（迭代 21 七节点微服务）：
#   Gateway 31300 / Login 31302 / Game 31304 / DB 31305 / Center 31306 / Battle 31307 / App 31308（HTTP 31309）
#   MySQL 3306 + Redis 6379（DB 节点业务库）；PostgreSQL 5432 默认不启动（profile: postgres）。
# 默认共享密钥：可在 .env 中设置 CenterNodeSharedSecret 覆盖，生产务必更换。
# 注意：默认值不能含占位符特征（change/placeholder/example 等），SecretConfig 会 fail-closed 拒绝。
# 凭据治理（P1）：本文件不再硬编码任何真实口令。数据库口令走 ${MYSQL_PASSWORD} / ${POSTGRES_PASSWORD}
# （默认值是**假**的开发口令 netgame-dev-db-pass）——生产必须在 .env 或密钥管理系统中覆盖。
# =====================================================================

name: netgame-cluster

x-common-node: &common-node
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &common-env
    CenterNodeSharedSecret: "${CenterNodeSharedSecret:-netgame-dev-9f3a7c1e5b2d8f4a6c0e9b3d7f1a5c2e}"
    Logging__MinimumLevel: "Information"
    # 健康检查端口（业务端口+10000）供宿主机 curl 访问：容器内须监听 0.0.0.0，
    # 否则 TcpListener 默认绑 127.0.0.1 无法被端口映射到达（生产可改回回环 + 探针走 exec）
    HealthListenAddress: "0.0.0.0"
    # 跨节点主机名：compose 服务名即容器 DNS 名，节点间用服务名互连
    GatewayHost: "gateway"
    LoginHost: "login"
    GameHost: "game"
    DBHost: "db"
    CenterHost: "center"
    BattleHost: "battle"
    AppHost: "app"
    RedisConnectionString: "redis:6379,abortConnect=false"
  depends_on:
    center:
      condition: service_started
  restart: unless-stopped
  networks: [cluster]

services:
  # ---------- 基础设施 ----------
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpass-change-me}"
      MYSQL_DATABASE: "GameDB"
      MYSQL_USER: "Ycs"
      # 凭据治理（P1）：真实口令已移出仓库，默认值是假口令，生产务必在 .env 覆盖
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-netgame-dev-db-pass}"
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      # 取容器内的 $MYSQL_PASSWORD（$$ 阻止 compose 插值），避免把口令写死在探针参数里（重复泄漏 + docker inspect 可见）
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uYcs -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [cluster]

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [cluster]

  # 可选：实体持久化 PostgreSQL 后端验证（默认不启动；需要时 docker compose --profile postgres up -d）
  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: "Ycs"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-netgame-dev-db-pass}"
      POSTGRES_DB: "GameDB"
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Ycs"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [cluster]

  # ---------- 业务节点（同镜像，working_dir + command 指定启动哪个） ----------
  db:
    <<: *common-node
    working_dir: /app/DB
    command: ["dotnet", "DB.dll", "--host", "db", "--port", "31305", "--node-id", "DB-db:31305"]
    environment:
      <<: *common-env
      ConnectionStrings__MySqlConnection: "Server=mysql;Port=3306;Database=GameDB;Uid=Ycs;Pwd=${MYSQL_PASSWORD:-netgame-dev-db-pass};"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["31305:31305", "41305:41305"]

  center:
    <<: *common-node
    working_dir: /app/Center
    command: ["dotnet", "Center.dll", "--host", "center", "--port", "31306", "--node-id", "Center-center:31306"]
    environment:
      <<: *common-env
      CenterHttpPort: "31316"
    # 覆盖锚点 depends_on：Center 不能依赖自身（依赖环），其余节点仍等待 center 先启动
    depends_on: {}
    ports: ["31306:31306", "31316:31316", "41306:41306"]

  gateway:
    <<: *common-node
    working_dir: /app/Gateway
    command: ["dotnet", "Gateway.dll", "--host", "gateway", "--port", "31300", "--center-host", "center", "--center-port", "31306", "--node-id", "Gateway-gateway:31300"]
    ports: ["31300:31300", "41300:41300"]

  login:
    <<: *common-node
    working_dir: /app/Login
    command: ["dotnet", "Login.dll", "--host", "login", "--port", "31302", "--center-host", "center", "--center-port", "31306", "--node-id", "Login-login:31302"]
    ports: ["31302:31302", "41302:41302"]

  game:
    <<: *common-node
    working_dir: /app/Game
    command: ["dotnet", "Game.dll", "--host", "game", "--port", "31304", "--center-host", "center", "--center-port", "31306", "--node-id", "Game-game:31304"]
    ports: ["31304:31304", "41304:41304"]

  battle:
    <<: *common-node
    working_dir: /app/Battle
    command: ["dotnet", "Battle.dll", "--host", "battle", "--port", "31307", "--center-host", "center", "--center-port", "31306", "--node-id", "Battle-battle:31307"]
    environment:
      <<: *common-env
      # 实体持久化后端（迭代 21 可插拔存储）：默认走 MySQL 实现实时验证；
      # 想用文件存储改为 Provider=File（无需 MySQL）；Redis/Postgres 同理：
      #   EntityPersistence__Provider: "Redis"
      #   EntityPersistence__ConnectionString: "redis:6379,abortConnect=false"
      #   EntityPersistence__Provider: "PostgreSql"
      #   EntityPersistence__ConnectionString: "Server=postgres;Port=5432;Database=GameDB;Uid=Ycs;Pwd=${POSTGRES_PASSWORD:-netgame-dev-db-pass};"
      EntityPersistence__Provider: "MySql"
      EntityPersistence__ConnectionString: "Server=mysql;Port=3306;Database=GameDB;Uid=Ycs;Pwd=${MYSQL_PASSWORD:-netgame-dev-db-pass};"
      EntityPersistence__FlushIntervalMs: "5000"
      EntityPersistence__FlushBatchSize: "256"
      # 跨 Battle 实体调用直达（迭代 21）：默认关闭（Center 中继）；多 Battle 场景开启可降 Center 热点
      EntityCallDirectRouting: "false"
      EntityCallLocationCacheTtlMs: "30000"
    ports: ["31307:31307", "41307:41307"]

  # 应用节点（AppServer）："游戏服务器 + 应用服务器"并存承载——
  # 内部 TCP(31308) 接网关转发的 80000-89999 段消息 + HTTP REST(31309) 应用面。
  app:
    <<: *common-node
    working_dir: /app/App
    command: ["dotnet", "App.dll", "--host", "app", "--port", "31308", "--center-host", "center", "--center-port", "31306", "--node-id", "App-app:31308"]
    environment:
      <<: *common-env
      # 应用面 HTTP 默认只监听回环；容器内须放开以被端口映射/反代到达（生产可在反代层收紧）
      AppHttpListenAddress: "0.0.0.0"
      # 应用面非公开接口的 API Key（生产务必在 .env 配置 HttpApiKeys 覆盖）
      HttpApiKeys: "${HttpApiKeys:-}"
    ports: ["31308:31308", "31309:31309", "41308:41308"]

  # ---------- 监控（Prometheus 抓取各节点 /metrics，Grafana 可视化 + 内置告警） ----------
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped
    networks: [cluster]

  grafana:
    image: grafana/grafana:latest
    environment:
      # 生产务必覆盖：GF_SECURITY_ADMIN_PASSWORD 或挂载独立 provisioning 的 admin 配置
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_started }
    restart: unless-stopped
    networks: [cluster]

volumes:
  mysql-data:
  pg-data:

networks:
  cluster:
    driver: bridge
